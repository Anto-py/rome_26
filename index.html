<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0D1617">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Roma 26">
  <title>Roma 26</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="vendor/leaflet/leaflet.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="entete">
    <h1 class="marque"><span class="marque-roma">Roma</span> <span class="marque-26">26</span></h1>
    <span id="pastille-reseau" class="pastille-reseau" hidden>hors ligne</span>
    <button id="bouton-recherche" class="bouton-recherche" type="button" aria-label="Rechercher">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
    </button>
  </header>

  <main>
    <section id="vue-maintenant" class="vue" aria-live="polite"></section>
    <section id="vue-programme" class="vue" hidden></section>
    <section id="vue-carte" class="vue vue-carte" hidden>
      <div class="carte-barre">
        <div id="carte-filtres" class="filtres" role="group" aria-label="Filtrer par jour"></div>
      </div>
      <p id="carte-hors-ligne" class="bandeau" hidden>Carte hors ligne : fond indisponible, lieux affichés</p>
      <p id="carte-message" class="bandeau bandeau-info" role="status" hidden></p>
      <div class="carte-zone">
        <div id="carte" class="carte"></div>
        <button id="bouton-ou" class="btn btn-action btn-ou" type="button">Où suis-je ?</button>
      </div>
    </section>
    <section id="vue-infos" class="vue" hidden></section>
  </main>

  <nav class="onglets" aria-label="Sections">
    <a class="onglet" href="#maintenant" data-vue="maintenant">Maintenant</a>
    <a class="onglet" href="#programme" data-vue="programme">Programme</a>
    <a class="onglet" href="#carte" data-vue="carte">Carte</a>
    <a class="onglet" href="#infos" data-vue="infos">Infos</a>
  </nav>

  <div id="recherche" class="recherche" role="dialog" aria-modal="true" aria-label="Recherche" hidden>
    <div class="recherche-entete">
      <input id="recherche-champ" class="recherche-champ" type="search" placeholder="Colisée, métro, Trevi…" autocomplete="off" enterkeyhint="search" aria-label="Rechercher dans le voyage">
      <button id="recherche-fermer" class="btn btn-secondaire" type="button">Fermer</button>
    </div>
    <div id="recherche-resultats" class="recherche-resultats"></div>
  </div>
</body>
</html>
